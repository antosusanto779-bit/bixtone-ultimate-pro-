name: Build BIXTONE APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kode Proyek
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Capacitor Core & CLI
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Init Capacitor Project
      run: |
        npx cap init "BIXTONE ULTIMATE PRO" "com.bixlabs.bixtone" --web-dir "."

    - name: Add Android Platform
      run: |
        npx cap add android

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Debug APK using Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BIXTONE-ULTIMATE-PRO-Debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
