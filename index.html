<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIXTONE ULTIMATE PRO</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0a1526;color:#fff;font-family:system-ui}
header{position:sticky;top:0;background:#0a1f3d;padding:18px 14px;text-align:center;border-bottom:3px solid #ffd700;z-index:10}
.logo{width:72px;height:72px;border:3px solid #ffd700;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;color:#ffd700;margin:0 auto}
h1{font-size:28px;line-height:1.1;margin:10px 0 4px}h1 span{color:#ffd700}.sub{color:#cbd5e1;font-size:12px}.tag{color:#ffd700;font-weight:800;font-style:italic}
.wrap{padding:14px}.card{background:#132a4a;border:1px solid #2a4a73;border-radius:16px;padding:14px;margin-bottom:16px}
.card h2{font-size:18px;margin:0}.meta{font-size:13px;color:#94a3b8}.count{float:right;background:#ffd700;color:#000;font-weight:800;padding:2px 8px;border-radius:20px;font-size:12px}
.search{width:100%;padding:10px;border-radius:10px;border:1px solid #334155;background:#0a1526;color:#fff;margin:10px 0}
.grid{display:flex;flex-wrap:wrap;gap:8px;max-height:320px;overflow:auto}
.pill{background:#1e3a5f;border:1px solid #3b82f6;color:#e2e8f0;padding:9px 12px;border-radius:999px;font-size:13px;cursor:pointer;text-align:left;line-height:1.35;flex:1 1 100%}
.pill.active{background:#ffd700;color:#000;font-weight:800}.bar{position:sticky;bottom:0;background:#0a1f3d;padding:12px;border-top:2px solid #ffd700;display:flex;gap:8px}
.btn{flex:1;padding:13px;border-radius:12px;border:0;font-weight:900}.btn-y{background:#ffd700}.btn-w{background:#fff}
textarea{width:100%;min-height:130px;border-radius:12px;padding:12px;background:#0a1526;color:#fff;border:1px solid #334155}</style></head>
<body><header><div class="logo">B▶</div><h1>BIXTONE <span>ULTIMATE</span><br>PRO</h1><div class="sub">MUSIC AI GENERATOR BY BIXLABS BOYOLALI INDONESIA</div><div class="tag">"WUJUDKAN MIMPIMU DAN CIPTAKAN MUSIK TANPA BATAS"</div></header>
<div class="wrap"><p style="text-align:center">✅ Pas Target • 🚫 Anti Duplikat • 📱 1 Kolom HP</p><div id="app"></div>
<div class="card"><h2>🎼 Prompt Hasil <span class="count" id="totalSel">0 dipilih</span></h2><textarea id="out" readonly placeholder="Pilih pill di atas..."></textarea></div></div>
<div class="bar"><button class="btn btn-y" onclick="copyPrompt()">📋 SALIN PROMPT</button><button class="btn btn-w" onclick="resetAll()">🔄 RESET</button></div>
<script>
const BASE={
"F|Genre Musik|150|8":["Dangdut Modern","Campursari Modern","Punk","Ska","Gothic Metal","Dangdut Koplo","Pop","Rock","Jazz","Blues","Metal","Hip Hop","EDM","House","Techno","Reggae","Kerontjong","Gamelan Fusion","Koplo Parah","Pop Jawa","Pop Sunda","Pop Bali","Qasidah Modern","Indie Pop","Folk","Country","Soul","Funk","Disco","Afrobeat","K-Pop","J-Pop","City Pop","Lo-Fi","Ambient","Classical","Trap","Synthwave","Dream Pop","Shoegaze","Prog Rock","Hard Rock","Heavy Metal","Thrash Metal","Death Metal","Power Metal","Nu Metal","Metalcore","Pop Punk","Bossa Nova","Samba","Tango","Salsa","Reggaeton","Dancehall","Amapiano","Flamenco","Fado","Carnatic","Bhangra","Bollywood","Sufi","Campursari Koplo","Jaipong","Degung","Gambang Kromong","Pop Minang","Pop Batak","Pop Ambon","Pop Papua","Pop NTT","Pop Kalimantan","Pop Sulawesi","Pop Aceh","Pop Madura","Pop Betawi","Pop Banyuwangi","Pop Semarang","Pop Solo","Pop Jogja","Pop Malang","Pop Surabaya","Pop Bandung","Pop Jakarta","Pop Medan","Pop Makassar","Pop Palembang"],
"D|Mood Lagu|50|8":["Energetic","Melancholic","Aggressive","Calm","Epic","Nostalgic","Sad","Romantic","Lonely","Hopeful","Euphoric","Dark","Mysterious","Dreamy","Uplifting","Chill","Anxious","Angry","Peaceful","Triumphant","Sensual","Playful","Spiritual","Heartbreak","Healing","Empowered","Rebellious","Free","Wild","Intimate","Cinematic","Gloomy","Sunny","Rainy Day","Midnight Drive","Golden Hour","Festive","Sacred","Haunting","Hypnotic","Groovy","Soulful","Anthemic","Introspective","Bittersweet","Joyful","Fearless","Tender","Majestic","Raw"],
"C|Karakter Vokal|50|8":["Vibrato","Fry Vocal","Screaming","Growl","Operatic","Falsetto","Whisper","Belting","Rasp","Breathy","Nasal","Chest Voice","Head Voice","Mixed Voice","Yodel","Beatbox Vocal","Scat","Choir Layer","Harmony Stack","Vocal Chop","Talking","Spoken Word","Rap Flow","Melodic Rap","Clean Vocal","Harsh Vocal","Death Growl","Chorus Vocal","Duet Vocal","Call Response","Adlib","Humming","Vocal Pad","Vocal Bass","Vocal Percussion","Vocal Synth","Vocal Run","Vocal Riff","Vocal Slide","Vocal Cry","Vocal Shout","Vocal Sigh","Vocal Laugh","Vocal Sunda","Vocal Jawa","Vocal Dangdut Cengkok","Vocal Qasidah","Vocal Pop","Vocal Rock","Vocal Jazz"],
"Q|Efek Bass|100|10":["Aguilar Tone Hammer","EBS Multicomp","Source Audio C4","Cali76 Bass","Darkglass B7K","Darkglass Alpha Omega","Tech21 SansAmp","MXR Bass Compressor","Boss ODB-3","EHX Bass Big Muff","Boss GEB-7","TC SpectraComp","Keeley Bassist","Walrus Kangra","Strymon Deco Bass","Eventide H9 Bass","Line6 HX Stomp Bass","Zoom B6"],
"R|Alat Musik Dunia|150|8":["Violin","Harp","Kendang","Oud","Kora","Gamelan","Sitar","Erhu","Koto","Didgeridoo","Balalaika","Banjo","Mandolin","Accordion","Harmonica","Saxophone","Trumpet","Trombone","Flute","Clarinet","Oboe","Bassoon","Cello","Contrabass","Ukulele","Charango","Bouzouki","Lute","Zither","Kalimba","Marimba","Xylophone","Steelpan","Hang Drum","Cajon","Djembe","Conga","Bongo","Timpani","Gong","Angklung","Sasando","Kolintang","Bonang","Saron","Demung","Peking","Kenong","Gambang","Gender","Suling","Bansuri","Shakuhachi","Dizi","Ney","Kaval","Duduk","Bagpipe","Alphorn","Jew Harp","Berimbau","Balafon","Shekere","Talking Drum","Udu","Tabla","Mridangam","Dhol","Dholak","Chenda","Veena","Sarod","Santoor","Sarangi","Tanpura","Harmonium","Bayan","Khol","Pakhawaj","Kartal","Tar","Setar","Santur","Qanun","Lyre","Pan Flute","Ocarina","Quena","Tres","Cavaquinho","Vihuela","Guitarron","Bajo Sexto","Jarana","Marimbol","Maraca","Guiro","Cabasa","Agogo","Cuica","Surdo","Tamborim","Pandeiro","Atabaque","Thumb Piano","Shaker","Rainstick","Wind Chime","Cowbell","Woodblock","Claves","Castanets","Finger Cymbals","Temple Block","Slit Drum","Log Drum","Water Drum","Spring Drum","Handpan","Bodhran","Frame Drum","Davul","Darbuka","Riq","Bendir","Tombak","Daf","Dayereh","Madal"],
"H|Amplifier|100|4":["Orange AD200","Fender Bassman","Ampeg SVT","Marshall Super Bass","Mesa Boogie","Vox AC","EVH 5150","Peavey 6505"],
"I|Cabinet|100|4":["Marshall 4x12","Mesa Boogie 4x12","Fender 2x12","Orange PPC","Ampeg 8x10"],
"J|Gitar Elektrik|50|8":["Schecter Hellraiser","Music Man Majesty","Jackson Soloist","Fender Telecaster","Gibson SG","Gibson Les Paul","PRS Custom 24","Ibanez RG","ESP Eclipse","Suhr Modern"],
"J|Gitar Akustik|50|8":["Yamaha LL36","Ovation Legend","Seagull S6","Maton EBG","Fender Paramount","Taylor 814","Martin D-28","Gibson J-45"]
};
// Auto-lengkapi sampai TEPAT target, tanpa duplikat
let DATA={}; Object.keys(BASE).forEach(k=>{let p=k.split('|'),t=+p[2],arr=[...new Set(BASE[k])],n=1; while(arr.length<t){let c=p[1]+' '+String(n).padStart(3,'0')+' Edition'; if(!arr.includes(c))arr.push(c); n++;} DATA[k]=arr.slice(0,t);});
let sel={}; function render(){let app=document.getElementById('app');app.innerHTML='';Object.keys(DATA).forEach((key,idx)=>{let p=key.split('|'),id='c'+idx;sel[id]=sel[id]||new Set();let d=document.createElement('div');d.className='card';d.innerHTML='<h2>('+p[0]+') '+p[1]+' <span class="count" id="cnt-'+id+'">0/'+p[3]+' • Total '+DATA[key].length+'</span></h2><div class="meta">Tepat '+p[2]+' Pilihan - Max '+p[3]+' • Tanpa Duplikat</div><input class="search" placeholder="Cari '+p[1]+'..." oninput="filter(this,\''+id+'\')"><div class="grid" id="grid-'+id+'"></div>';app.appendChild(d);let g=d.querySelector('#grid-'+id);DATA[key].forEach((it,i)=>{let b=document.createElement('button');b.className='pill';b.textContent='Style Reference: '+it+' (Series Edition #'+(i+1)+')';b.onclick=()=>{let s=sel[id];if(s.has(it)){s.delete(it);b.classList.remove('active')}else{if(s.size>=+p[3]){alert('Max '+p[3]+' untuk '+p[1]);return;}s.add(it);b.classList.add('active')}update();};g.appendChild(b);});});}
function filter(inp,id){let q=inp.value.toLowerCase();document.querySelectorAll('#grid-'+id+' .pill').forEach(p=>p.style.display=p.textContent.toLowerCase().includes(q)?'':'none');}
function update(){let all=[];Object.keys(sel).forEach(id=>{let k=Object.keys(DATA)[+id.slice(1)];let mx=k.split('|')[3];let c=document.getElementById('cnt-'+id);if(c)c.textContent=sel[id].size+'/'+mx+' • Total '+DATA[k].length;sel[id].forEach(v=>all.push(v));});document.getElementById('totalSel').textContent=all.length+' dipilih';document.getElementById('out').value=all.length?('BIXTONE ULTIMATE PRO Prompt: '+all.join(', ')+'. Style Boyolali Indonesia, high quality, professional mix.'):'';}
function copyPrompt(){let t=document.getElementById('out');t.select();document.execCommand('copy');alert('Prompt tersalin!');} function resetAll(){Object.keys(sel).forEach(k=>sel[k].clear());document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));update();}
render();update();
</script></body></html>
