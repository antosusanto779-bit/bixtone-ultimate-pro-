openapi: 3.0.3
info:
  title: BIXTONE ULTIMATE PRO API
  version: 0.1.0
  description: |
    API awal untuk proyek Music AI Generator BIXLABS. Prompt dibuat sebagai JSON
    tiga layer. Katalog brand/seri bersifat referensi deskriptif dan wajib melewati
    status review sebelum ditampilkan kepada pengguna.
servers:
  - url: https://api.example.com
    description: Placeholder — ganti dengan domain backend produksi

tags:
  - name: Projects
  - name: Generation
  - name: Catalog
  - name: Audio
  - name: Sharing

paths:
  /v1/projects:
    post:
      tags: [Projects]
      summary: Create a music project draft
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectDraft'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get project and latest version
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/projects/{projectId}/generate:
    post:
      tags: [Generation]
      summary: Queue a generation job from the three-layer prompt
      operationId: generateProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '202':
          description: Generation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
        '409':
          description: Duplicate idempotency key or project is already generating
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/generation-jobs/{jobId}:
    get:
      tags: [Generation]
      summary: Poll a generation job
      operationId: getGenerationJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'

  /v1/projects/{projectId}/corrections:
    post:
      tags: [Generation]
      summary: Create a correction/perfection version
      operationId: createCorrection
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
      responses:
        '202':
          description: Correction queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
        '422':
          $ref: '#/components/responses/ValidationError'

  /v1/projects/{projectId}/remove-generate:
    post:
      tags: [Generation]
      summary: Remove selected stem target and generate a new version
      operationId: removeAndGenerate
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveGenerateRequest'
      responses:
        '202':
          description: Remove/generate queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'

  /v1/projects/{projectId}/remake-record-generate:
    post:
      tags: [Generation]
      summary: Upload or reference a recorded take and generate a new version
      operationId: remakeRecordGenerate
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemakeRequest'
      responses:
        '202':
          description: Remake queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'

  /v1/catalog:
    get:
      tags: [Catalog]
      summary: Search approved catalog items
      operationId: searchCatalog
      parameters:
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/CatalogCategory' }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Catalog page
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogItem' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }

  /v1/exports:
    post:
      tags: [Audio]
      summary: Queue an audio export
      operationId: createExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId, formats]
              properties:
                versionId: { type: string }
                formats:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [wav, flac, mp3, aac, m4a, ogg, stems_zip]
      responses:
        '202':
          description: Export queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'

  /v1/share-links:
    post:
      tags: [Sharing]
      summary: Create a revocable, expiring share link
      operationId: createShareLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId, visibility]
              properties:
                versionId: { type: string }
                visibility:
                  type: string
                  enum: [private, unlisted, public]
                expiresInSeconds:
                  type: integer
                  minimum: 300
                  default: 604800
      responses:
        '201':
          description: Share link created
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt, revocable]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  revocable: { type: boolean }

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16 }
  responses:
    NotFound:
      description: Resource not found
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            type: object
            required: [code, errors]
            properties:
              code: { type: string, example: VALIDATION_ERROR }
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field: { type: string }
                    code: { type: string }
                    message: { type: string }
  schemas:
    CatalogCategory:
      type: string
      enum:
        - voice_character
        - mood
        - genre
        - microphone
        - amp
        - cab
        - electric_guitar
        - acoustic_guitar
        - bass
        - drum
        - snare
        - cymbals
        - mixer
        - mastering
        - guitar_effect
        - bass_effect
        - world_instrument
    CatalogItem:
      type: object
      required: [id, category, displayName, style, rightsStatus, reviewStatus]
      properties:
        id: { type: string }
        category: { $ref: '#/components/schemas/CatalogCategory' }
        displayName: { type: string }
        brand: { type: string, nullable: true }
        series: { type: string, nullable: true }
        style: { type: string }
        inspireBy: { type: string }
        sourceUrl: { type: string, format: uri, nullable: true }
        rightsStatus:
          type: string
          enum: [generic_descriptor, reference_only, licensed, pending, removed]
        reviewStatus:
          type: string
          enum: [needs_editor_review, needs_cultural_review, approved_for_seed, approved, rejected]
        active: { type: boolean }
    ProjectDraft:
      type: object
      required: [title, mode, referencePolicyAccepted]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        mode: { type: string, enum: [song, instrumental] }
        language: { type: string, default: id }
        tempoEnabled:
          type: boolean
          default: false
          description: If false, the engine selects a coherent tempo automatically.
        tempoBpm:
          type: integer
          minimum: 50
          maximum: 200
          nullable: true
          description: Required only when tempoEnabled is true.
        key: { type: string, nullable: true }
        durationSeconds:
          type: integer
          minimum: 60
          maximum: 480
          default: 180
          description: Generate duration in seconds; UI exposes 1–8 minute choices.
        referencePolicyAccepted: { type: boolean, const: true }
    GenerateRequest:
      type: object
      required: [prompt, seed]
      properties:
        prompt:
          type: object
          description: JSON payload from src/prompt-builder.mjs
        seed:
          type: integer
          minimum: 0
        modelId: { type: string }
        outputProfile:
          type: string
          enum: [preview, standard, pro]
          default: standard
    CorrectionRequest:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          minItems: 1
          items:
            type: string
            enum: [melody, vocal_clarity, lyric_alignment, arrangement_balance, low_end, mix_polish, mastering_safety]
        regionStartSeconds: { type: number, minimum: 0, nullable: true }
        regionEndSeconds: { type: number, minimum: 0, nullable: true }
        intensity: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        instruction: { type: string, maxLength: 2000 }
    RemoveGenerateRequest:
      type: object
      required: [stems]
      properties:
        stems:
          type: array
          minItems: 1
          items:
            type: string
            enum: [vocal, guitar, bass, drum]
        removeAmount: { type: number, minimum: 0, maximum: 1, default: 1 }
        preserveAmbience: { type: number, minimum: 0, maximum: 1, default: 0.25 }
        replacementInstruction: { type: string, maxLength: 2000 }
    RemakeRequest:
      type: object
      required: [role, takeAssetId, performanceMode]
      properties:
        role:
          type: string
          enum: [vocal, guitar, bass, drum]
        takeAssetId: { type: string }
        performanceMode:
          type: string
          enum: [keep_performance, reinterpret_performance]
        consentConfirmed: { type: boolean, const: true }
    Project:
      type: object
      required: [id, title, mode, status, latestVersion]
      properties:
        id: { type: string }
        title: { type: string }
        mode: { type: string, enum: [song, instrumental] }
        status: { type: string, enum: [draft, queued, ready, failed, archived] }
        latestVersion: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GenerationJob:
      type: object
      required: [id, status, progress]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, processing, ready, failed, canceled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        phase: { type: string }
        versionId: { type: string, nullable: true }
        errorCode: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ExportJob:
      type: object
      required: [id, status, formats]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, processing, ready, failed] }
        formats:
          type: array
          items: { type: string }
        files:
          type: array
          items:
            type: object
            required: [format, url]
            properties:
              format: { type: string }
              url: { type: string, format: uri }
