openapi: 3.0.3
info:
  title: BIXTONE ULTIMATE PRO API
  version: 1.0.0
  description: |
    API Resmi untuk platform BIXTONE ULTIMATE PRO - Music AI Generator 
    oleh BIXLABS Boyolali Indonesia. Menggunakan arsitektur prompt 3-layer 
    (Vokal, Instrumen/Rig, Studio Mixing & Mastering) berbasis engine open-source ACE-Step.
servers:
  - url: https://api.bixtone.bixlabs.id/v1
    description: Server Produksi Utama (Bixlabs Boyolali)

tags:
  - name: Projects
    description: Manajemen draf dan proyek musik AI
  - name: Generation
    description: Pemrosesan 3-layer prompt, koreksi, dan stem editing
  - name: Catalog
    description: Direktori referensi brand, efek, dan instrumen dunia
  - name: Audio
    description: Ekspor multi-format (WAV, MP3, Stems, dll)
  - name: Sharing
    description: Manajemen tautan berbagi lintas platform (WhatsApp, IG, dll)

paths:
  /projects:
    post:
      tags: [Projects]
      summary: Membuat draf proyek musik baru
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectDraft'
      responses:
        '201':
          description: Draf proyek berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{projectId}:
    get:
      tags: [Projects]
      summary: Mendapatkan detail proyek beserta versi terakhirnya
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Detail proyek ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/generate:
    post:
      tags: [Generation]
      summary: Mengantrekan job generasi musik dari arsitektur 3-layer prompt
      operationId: generateProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '202':
          description: Job generasi berhasil diantrekan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
        '409':
          description: Konflik kunci idempotensi atau proyek sedang diproses
        '422':
          $ref: '#/components/responses/ValidationError'

  /generation-jobs/{jobId}:
    get:
      tags: [Generation]
      summary: Memeriksa status antrean generasi job (Polling)
      operationId: getGenerationJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Status job saat ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'

  /projects/{projectId}/corrections:
    post:
      tags: [Generation]
      summary: Fitur Koreksi/Perfection (mengoreksi dan menyempurnakan hasil lagu)
      operationId: createCorrection
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
      responses:
        '202':
          description: Koreksi berhasil diantrekan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
        '422':
          $ref: '#/components/responses/ValidationError'

  /projects/{projectId}/remove-generate:
    post:
      tags: [Generation]
      summary: Fitur Remove + Generate (menghilangkan vokal/gitar/bass/drum tertentu)
      operationId: removeAndGenerate
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveGenerateRequest'
      responses:
        '202':
          description: Proses remove stem diantrekan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'

  /projects/{projectId}/remake-record-generate:
    post:
      tags: [Generation]
      summary: Fitur Remake + Record + Generate (mengisi/overdub ulang vokal atau instrumen)
      operationId: remakeRecordGenerate
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemakeRequest'
      responses:
        '202':
          description: Proses remake take diantrekan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'

  /catalog:
    get:
      tags: [Catalog]
      summary: Mencari data item katalog (brand, amp, efek, genre, instrumen dunia, dll)
      operationId: searchCatalog
      parameters:
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/CatalogCategory' }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Hasil pencarian katalog
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogItem' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }

  /exports:
    post:
      tags: [Audio]
      summary: Mengunduh semua format musik (WAV, FLAC, MP3, Stems, dll)
      operationId: createExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId, formats]
              properties:
                versionId: { type: string }
                formats:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [wav, flac, mp3, aac, m4a, ogg, stems_zip]
      responses:
        '202':
          description: Job ekspor file diantrekan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'

  /share-links:
    post:
      tags: [Sharing]
      summary: Membagikan lagu ke semua platform (WhatsApp, IG, Telegram, dll)
      operationId: createShareLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId, visibility]
              properties:
                versionId: { type: string }
                visibility:
                  type: string
                  enum: [private, unlisted, public]
                expiresInSeconds:
                  type: integer
                  minimum: 300
                  default: 604800
      responses:
        '201':
          description: Tautan berbagi berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt, revocable]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  revocable: { type: boolean }

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16 }

  responses:
    NotFound:
      description: Sumber daya tidak ditemukan
    ValidationError:
      description: Validasi permintaan gagal
      content:
        application/json:
          schema:
            type: object
            required: [code, errors]
            properties:
              code: { type: string, example: VALIDATION_ERROR }
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field: { type: string }
                    code: { type: string }
                    message: { type: string }

  schemas:
    CatalogCategory:
      type: string
      enum:
        - voice_character
        - mood
        - genre
        - microphone
        - amp
        - cab
        - electric_guitar
        - acoustic_guitar
        - bass
        - drum
        - snare
        - cymbals
        - mixer
        - mastering
        - guitar_effect
        - bass_effect
        - world_instrument
        - vocal_effect

    CatalogItem:
      type: object
      required: [id, category, displayName, style, rightsStatus, reviewStatus]
      properties:
        id: { type: string }
        category: { $ref: '#/components/schemas/CatalogCategory' }
        displayName: { type: string }
        brand: { type: string, nullable: true }
        series: { type: string, nullable: true }
        style: { type: string }
        inspireBy: { type: string, description: "Keterangan style/reference/inspire by untuk keamanan hak cipta" }
        sourceUrl: { type: string, format: uri, nullable: true }
        rightsStatus:
          type: string
          enum: [generic_descriptor, reference_only, licensed, pending, removed]
        reviewStatus:
          type: string
          enum: [needs_editor_review, needs_cultural_review, approved_for_seed, approved, rejected]
        active: { type: boolean }

    ProjectDraft:
      type: object
      required: [title, mode, referencePolicyAccepted]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        mode: { type: string, enum: [song, instrumental] }
        language: { type: string, default: id, description: "Mendukung Bahasa Indonesia dan Bahasa Jawa (Ngoko/Krama/Dialek)" }
        tempoEnabled:
          type: boolean
          default: false
          description: "Jika true, tempo mengikuti rentang 50-200 BPM"
        tempoBpm:
          type: integer
          minimum: 50
          maximum: 200
          nullable: true
        key: { type: string, nullable: true }
        durationSeconds:
          type: integer
          minimum: 60
          maximum: 480
          default: 180
          description: "Durasi lagu antara 1 hingga 8 menit"
        referencePolicyAccepted: { type: boolean, description: "Persetujuan disclaimer merek dagang" }

    GenerateRequest:
      type: object
      required: [prompt, seed]
      properties:
        prompt:
          type: object
          description: "Payload JSON Arsitektur 3-Layer (Layer 1: Vokal, Layer 2: Instrumen/Rig, Layer 3: Studio Mastering)"
        seed:
          type: integer
          minimum: 0
        modelId: { type: string, default: "acestep-opensource-default" }
        outputProfile:
          type: string
          enum: [preview, standard, expert_pro]
          default: standard

    CorrectionRequest:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          minItems: 1
          items:
            type: string
            enum: [melody, vocal_clarity, lyric_alignment, arrangement_balance, low_end, mix_polish, mastering_safety]
        regionStartSeconds: { type: number, minimum: 0, nullable: true }
        regionEndSeconds: { type: number, minimum: 0, nullable: true }
        intensity: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        instruction: { type: string, maxLength: 2000 }

    RemoveGenerateRequest:
      type: object
      required: [stems]
      properties:
        stems:
          type: array
          minItems: 1
          items:
            type: string
            enum: [vocal, guitar, bass, drum]
        removeAmount: { type: number, minimum: 0, maximum: 1, default: 1 }
        preserveAmbience: { type: number, minimum: 0, maximum: 1, default: 0.25 }
        replacementInstruction: { type: string, maxLength: 2000 }

    RemakeRequest:
      type: object
      required: [role, takeAssetId, performanceMode]
      properties:
        role:
          type: string
          enum: [vocal, guitar, bass, drum]
        takeAssetId: { type: string }
        performanceMode:
          type: string
          enum: [keep_performance, reinterpret_performance]
        consentConfirmed: { type: boolean }

    Project:
      type: object
      required: [id, title, mode, status, latestVersion]
      properties:
        id: { type: string }
        title: { type: string }
        mode: { type: string, enum: [song, instrumental] }
        status: { type: string, enum: [draft, queued, ready, failed, archived] }
        latestVersion: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    GenerationJob:
      type: object
      required: [id, status, progress]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, processing, ready, failed, canceled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        phase: { type: string }
        versionId: { type: string, nullable: true }
        errorCode: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    ExportJob:
      type: object
      required: [id, status, formats]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, processing, ready, failed] }
        formats:
          type: array
          items: { type: string }
        files:
          type: array
          items:
            type: object
            required: [format, url]
            properties:
              format: { type: string }
              url: { type: string, format: uri }
