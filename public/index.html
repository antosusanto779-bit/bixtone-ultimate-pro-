<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIXTONE ULTIMATE PRO V6 - Bixlabs Boyolali</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif;background:#05070a;color:#e5e7eb}.orbit{font-family:Orbitron,sans-serif}.card-glass{background:linear-gradient(145deg,rgba(17,24,39,.9),rgba(0,0,0,.9));border:1px solid rgba(96,165,250,.2)}.gold-text{background:linear-gradient(90deg,#FFD700,#C0C0C0,#60A5FA);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.btn-gold{background:linear-gradient(90deg,#FFD700,#C0C0C0,#3B82F6);color:#000;font-weight:800}.instrument-chip{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer}.instrument-chip.active{background:linear-gradient(90deg,rgba(59,130,246,.3),rgba(255,215,0,.2));border-color:#FFD700;color:#FFD700}</style></head><body class="min-h-screen"><header class="p-4 border-b border-blue-900/30 flex justify-between items-center sticky top-0 bg-black/80 backdrop-blur"><div class="orbit text-lg font-extrabold gold-text">BIXTONE ULTIMATE PRO V6</div><div class="flex gap-2"><button id="lang-id" class="px-3 py-1 rounded bg-blue-600 text-white text-xs">ID</button><button id="lang-en" class="px-3 py-1 rounded bg-zinc-800 text-zinc-400 text-xs">EN</button></div></header><main class="max-w-6xl mx-auto p-4 grid md:grid-cols-3 gap-6"><div class="md:col-span-2 space-y-5"><div class="card-glass rounded-2xl p-5"><label class="text-xs text-blue-300">PROMPT / DESKRIPSI LAGU</label><textarea id="prompt" rows="3" class="w-full mt-2 bg-black/50 border border-blue-900/50 rounded-xl p-3 text-sm outline-none" placeholder="Gamelan Jawa sedih, kendang koplo, suling bali, hujan, epik..."></textarea><div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4"><div><label class="text-[11px] text-zinc-400">DURASI</label><select id="duration" class="w-full bg-black border border-zinc-700 rounded-lg p-2 text-sm mt-1"><option value="60">1 Menit</option><option value="120">2 Menit</option><option value="180">3 Menit</option><option value="240">4 Menit</option><option value="300">5 Menit</option><option value="360" selected>6 Menit - MAX</option></select></div><div><label class="text-[11px] text-zinc-400">TEMPO MODE</label><select id="tempoMode" class="w-full bg-black border border-zinc-700 rounded-lg p-2 text-sm mt-1"><option value="auto">AUTO</option><option value="manual">MANUAL ON</option><option value="off">OFF</option></select></div><div><label class="text-[11px] text-zinc-400">BPM</label><input id="bpm" type="number" value="90" class="w-full bg-black border border-zinc-700 rounded-lg p-2 text-sm mt-1"></div><div><label class="text-[11px] text-zinc-400">KEY</label><select id="key" class="w-full bg-black border border-zinc-700 rounded-lg p-2 text-sm mt-1"><option>C Mayor</option><option>G Mayor</option><option>Am Minor</option><option selected>Dm Epic</option></select></div></div></div><div class="card-glass rounded-2xl p-5"><div class="flex justify-between"><h3 class="orbit text-xs gold-text">150+ ALAT MUSIK DUNIA</h3><span id="selectedCount" class="text-xs text-zinc-500">0 dipilih</span></div><div id="instrumentGrid" class="grid grid-cols-2 md:grid-cols-3 gap-2 mt-3 max-h-72 overflow-y-auto"></div></div><button id="generateBtn" class="btn-gold w-full py-4 rounded-xl orbit text-sm">GENERATE 3 VERSI - BIXTONE V6</button><div id="results" class="space-y-3"></div></div><div class="space-y-5"><div class="card-glass rounded-2xl p-5"><h4 class="orbit text-xs text-blue-300">V6 FEATURES - BIXLABS BOYOLALI</h4><ul class="text-xs mt-3 space-y-2 text-zinc-400 list-disc ml-4"><li>Tema Hitam-Biru-Silver-Emas</li><li>Bilingual ID/EN</li><li>150 Instrumen Dunia</li><li>Durasi 6 Menit Max</li><li>Tempo ON/OFF + BPM</li><li>Generate 3 Versi</li><li>Play, Download, Share</li></ul></div></div></main><script>const instruments=["Gamelan Jawa","Kendang Koplo","Suling Bali","Rebab","Bonang","Gambang","Kempul","Saron","Kendang Sunda","Angklung","Koto - Japan","Shakuhachi","Taiko","Shamisen","Erhu - China","Guqin","Pipa","Dizi","Yangqin","Guzheng","Duduk - Armenian","Oud","Darbuka","Ney","Santoor","Sitar - India","Tabla","Bansuri","Sarod","Sarangi","Bagpipe","Bodhran","Harp Celtic","Violin","Cello","Piano Grand","Acoustic Guitar","Electric Guitar","Bass","Drum Kit","Hang Drum","Kalimba","Didgeridoo","Balafon","Djembe","Kora","Mbira","Berimbau - Brazil","Charango","Pan Flute","Gamelan Bali","Sasando","Kolintang","Tifa Papua","Sape Dayak","Gendang Melayu","Seruling Melayu","Gambus","Marawis","Accordion","Harmonica","Banjo","Mandolin","Ukulele","Saxophone","Trumpet","Trombone","Clarinet","Flute Classical","Synth Pad","Synth Lead","Synth Bass","Arp","808","Choir","Strings Ensemble","Brass Ensemble","Chimes","Glockenspiel","Steel Drum","Reggae Organ","Kantele","Nyckelharpa","Hardanger Fiddle","Morin Khuur - Mongolia","Dulcimer","Zither","Lute","Hurdy Gurdy","Bandoneon - Tango","Cajon","Bongo","Conga","Timbales","Guiro","Maracas","Claves","Cowbell","Woodblock","Rain Stick","Ocean Drum","Wind Chimes","Thunder FX","Birds Nature","Pad Warm","Pad Dark","Pad Shimmer","Bass Sub","Kick Epic","Santur - Persian","Kanun","Rebec","Lyre","Aulos","Shawm","Crumhorn","Nyatiti - Kenya","Adungu","Ngoni","Gamelan Sunda Degung","Kendang Jaipong","Suling Sunda","Kacapi","Suling Batak","Gondang","Talempong Minang","Saluang","Gendang Beleq","Serunai","Alp Horn","Cow Horn","War Drum","Military Snare","Timpani","Celesta","Harpsichord","Pipe Organ","Music Box","Toy Piano","LoFi Keys","LoFi Drums","Vinyl Crackle","Tape Hiss","Vocal Chop","Vocal Ah","Whistle","Beatbox"];const grid=document.getElementById('instrumentGrid');let selected=new Set();function render(){grid.innerHTML='';instruments.forEach(n=>{const d=document.createElement('div');d.className='instrument-chip text-[11px] px-2 py-2 rounded-lg flex justify-between '+(selected.has(n)?'active':'');d.innerHTML=`<span>${n}</span><span>${selected.has(n)?'✓':'+'}</span>`;d.onclick=()=>{if(selected.has(n))selected.delete(n);else{if(selected.size>=8){alert('Max 8');return;}selected.add(n);}document.getElementById('selectedCount').innerText=selected.size+' dipilih';render();};grid.appendChild(d);});}render();document.getElementById('generateBtn').onclick=()=>{const prompt=document.getElementById('prompt').value||'Gamelan epic';const dur=document.getElementById('duration').value;const bpm=document.getElementById('bpm').value;const tempo=document.getElementById('tempoMode').value;const res=document.getElementById('results');res.innerHTML='';if(!selected.size){alert('Pilih minimal 1 alat!');return;}for(let v=1;v<=3;v++){const c=document.createElement('div');c.className='card-glass rounded-xl p-4';const list=Array.from(selected).join(', ');c.innerHTML=`<div class="flex justify-between"><div><div class="orbit text-xs gold-text">VERSI ${v}</div><div class="text-[11px] text-zinc-400 mt-1">${list}<br>Dur:${dur}s | BPM:${bpm} | Tempo:${tempo}</div></div><span class="text-[10px] px-2 py-1 bg-green-900/30 border border-green-700 rounded">RENDERED</span></div><div class="mt-3 bg-black rounded-lg p-3 flex items-center gap-3"><button class="playBtn w-10 h-10 rounded-full bg-white text-black flex items-center justify-center">▶</button><div class="flex-1 h-1 bg-zinc-800 rounded"><div class="progress h-1 bg-gradient-to-r from-blue-500 to-yellow-400 rounded" style="width:0%"></div></div><span class="text-[11px] time">0:00 / ${Math.floor(dur/60)}:${String(dur%60).padStart(2,'0')}</span></div><div class="flex gap-2 mt-3"><button class="flex-1 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs">⬇ Download MP3</button><button class="flex-1 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs">🔗 Share</button></div>`;res.appendChild(c);const pb=c.querySelector('.playBtn');const pr=c.querySelector('.progress');const tm=c.querySelector('.time');let play=false,int,sec=0;pb.onclick=()=>{if(!play){play=true;pb.innerText='⏸';int=setInterval(()=>{sec++;if(sec>=dur){clearInterval(int);play=false;pb.innerText='▶';sec=0;}const pct=(sec/dur)*100;pr.style.width=pct+'%';tm.innerText=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} / ${Math.floor(dur/60)}:${String(dur%60).padStart(2,'0')}`;},100);}else{play=false;pb.innerText='▶';clearInterval(int);}};}};</script></body></html>
